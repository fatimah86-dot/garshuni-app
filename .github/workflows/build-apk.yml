name: Build Debug APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Fix google-services.json
        run: |
          find . -name "google-services.json" -delete
          mkdir -p app
          echo '{"project_info":{"project_number":"1234567890","project_id":"garshuni-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef","android_client_info":{"package_name":"com.aistudio.garshuni.trnxkp"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          cat app/google-services.json
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Garshuni-APK
          path: app/build/outputs/apk/debug/*.apk
