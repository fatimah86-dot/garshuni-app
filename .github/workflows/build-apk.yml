name: Build Debug APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: FIX OCR BIAR BISA BACA ARAB
        run: |
          # Tambah Arabic model
          grep -q "text-recognition-arabic" app/build.gradle.kts || sed -i '/mlkit.text.recognition/a \            implementation("com.google.mlkit:text-recognition-arabic:16.0.0")' app/build.gradle.kts
          # Ganti DEFAULT_OPTIONS jadi ARABIC
          find app/src -type f -name "*.kt" -exec sed -i 's/TextRecognizerOptions.DEFAULT_OPTIONS/ArabicTextRecognizerOptions.Builder().build()/g' {} \;
          find app/src -type f -name "*.kt" -exec sed -i '/import com.google.mlkit.vision.text.*TextRecognition/a import com.google.mlkit.vision.text.arabic.ArabicTextRecognizerOptions' {} \;
          cat app/build.gradle.kts | grep -A2 mlkit
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Garshuni-APK-Arabic
          path: app/build/outputs/apk/debug/*.apk
