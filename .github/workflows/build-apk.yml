name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create missing files
        run: |
          # Buat google-services.json dummy biar Google Services Plugin tidak error
          mkdir -p app/src/debug
          echo '{"project_info":{"project_number":"123456789","project_id":"garshuni-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:dummy","android_client_info":{"package_name":"com.garshuni.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}]},"configuration_version":"1"}' > app/google-services.json
          echo '{"project_info":{"project_number":"123456789","project_id":"garshuni-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:dummy","android_client_info":{"package_name":"com.garshuni.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}]},"configuration_version":"1"}' > app/src/debug/google-services.json
          # Buat debug.keystore dummy
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          ls -la

      - name: Build Debug APK
        run: gradle assembleDebug -x validateSigningDebug --stacktrace || gradle assembleDebug -Pandroid
